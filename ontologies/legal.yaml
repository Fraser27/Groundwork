# Legal domain ontology — the default pack.
#
# The two-tier predicate split is the important part of this file.
#
# `governing` predicates drive decisions with legal consequence: conflicts,
# privilege, deadlines, citation authority. These are a CLOSED set, validated at
# write time. If an extractor proposes `is_counsel_to`, the write is REJECTED
# rather than quietly recorded — because a conflict check that returns no rows
# because of a synonym looks exactly like a clean conflict check.
#
# `descriptive` predicates are open, with exact-name grounding and no LLM. Sprawl
# here costs retrieval precision, not a malpractice claim.
#
# The test for which tier a predicate belongs in: would a wrong answer here
# embarrass you, or expose you? Embarrass -> descriptive. Expose -> governing.

domain: legal
version: 1

# Trailing words that are legal-form noise rather than part of a company's name. Used ONLY to ask
# a reviewer whether two ids are the same company — never to rewrite a stored id. `Calder Shipping
# AG` and `Calder Shipping Ltd` are routinely a parent and its English subsidiary, which is exactly
# what AFFILIATE_OF records, so collapsing them would turn an affiliate conflict into a false
# direct one. Detect aggressively, merge only by human act.
entity_suffixes:
  - ag
  - sa
  - nv
  - bv
  - gmbh
  - plc
  - ltd
  - limited
  - llp
  - llc
  - inc
  - corp
  - corporation
  - pty
  - srl
# Deliberately NOT here: `holdings`, `group`, `partners`, `trading`. Those are part of a name
# rather than its legal form — `Acme Corp` and `Acme Holdings` are two companies, and treating
# `holdings` as noise makes them collide. A key that over-generates asks a reviewer a stupid
# question; this one would ask a *misleading* one, and a reviewer who merges on it loses a real
# distinction with no record that anything was collapsed.

# `external_id: true` marks a kind whose id after the colon belongs to another system, so it is
# preserved byte-for-byte instead of being normalised. `matter:NTL-2026-0114` is a
# case-management reference and `table:src-1:legal.matters` is a Glue name; lowercasing either
# breaks the join back to the system that issued it. A Party's id is minted here from words on a
# page, so it is ours to canonicalise — which is what stops one company becoming several nodes.

# Offered on the Ask and Retrieval pages, in this order. These three were hardcoded in the
# UI, which is why a retail tenant was invited to check a conflict for a client called
# Calder and got nothing back.
example_questions:
  - What were fees billed by practice area last quarter?
  - Does acting for Calder create a conflict?
  - Which open matters rely on authority that has been overruled?

entity_types:
  - id: Matter
    label: Matter
    description: An engagement — a case, transaction, or advisory instruction.
    help: The organising unit of legal work. Most other entities hang off a Matter.
    external_id: true
    # What a reader navigates by. The scoping key stays `matter_id` everywhere in the code;
    # this is only what it is called on screen.
    organising_unit: true
  - id: Party
    label: Party
    description: A person or organisation with an interest in a matter.
    help: Clients, counterparties, and third parties are all Parties. The role is on the edge, not the node — the same company can be a client on one matter and adverse on another.
  - id: Counsel
    label: Counsel
    description: A lawyer or firm acting on a matter.
    help: Includes internal fee earners and external firms.
  - id: Document
    label: Document
    description: A filing, contract, opinion, or correspondence item.
    help: Documents are immutable in S3. What you see here is derived metadata plus extracted assertions.
    # `document:doc-<hex>` — assigned at ingest and used as a join key into S3 and the vector index.
    external_id: true
  - id: Authority
    label: Authority
    description: A cited case, statute, or regulation.
    help: "A case, statute or regulation the document refers to. Its presence is
      confirmed by finding the citation text on the page; what the document does with
      it — relies on, distinguishes, overrules — is a reviewed judgement."
  - id: Court
    label: Court
    description: A forum or tribunal.
  - id: Deadline
    label: Deadline
    description: A date-bound obligation.
    help: Limitation periods and filing deadlines. Governing predicates, because a missed one is negligence.
  - id: Clause
    label: Clause
    description: A provision within a contract.

  # Structural, not legal. Declared here because the vocabulary is closed and a scanner is held to
  # it exactly as an extractor is: these three existed in the graph while no pack named them, which
  # is the drift that closing the vocabulary is meant to make impossible. `layer: catalog` is what
  # lets the graph be read one half at a time, without the UI hardcoding id prefixes.
  - id: Source
    label: Source
    description: A system of record that was catalogued, such as an AWS Glue database.
    help: Not a legal entity. It is here so a schema declaration has something to hang off, and so the graph can be read as facts or as schema rather than as one tangle.
    layer: catalog
    external_id: true
  - id: Table
    label: Table
    description: A table in a catalogued source.
    help: Schema only. No rows enter the graph — they stay in the warehouse and are queried in place when a question needs them.
    layer: catalog
    external_id: true
  - id: Column
    label: Column
    description: A column in a catalogued table.
    help: Its name, type and description are citable as facts declared by a system of record, which is what lets a governed metric compile against a real schema.
    layer: catalog
    external_id: true

# ── Closed vocabulary. Write-time validation. No LLM may invent these. ────────
governing_predicates:
  - id: REPRESENTS
    label: represents
    domain: [Counsel]
    range: [Party]
    description: Counsel acts for this party.
    help: Half of every conflict check. Kept closed so `acts_for` and `is_counsel_to` can never fragment it.
  - id: ADVERSE_TO
    label: adverse to
    # A matter is adverse to a party: *this engagement of ours* is against *them*. Party -> Party
    # was also allowed, and that permissiveness was the bug. Combined with `symmetric: true` it made
    # the two ends interchangeable, because `canonical_pair` byte-sorts them before anything reads
    # them -- so nothing downstream could tell the firm's client from the counterparty. A rule
    # asking "are we against a party we also act for" then bound its matter variable to whichever
    # party sorted first, and produced a conflict flag against the firm's own client.
    domain: [Matter]
    range: [Party]
    description: This matter is positioned against this party.
    help: "The other half of a conflict check. Recorded from the matter rather than between two parties, because \"we are acting against them\" is the claim a conflict check needs and \"these two are opposed\" does not say who we act for."
    # Not symmetric, now that the ends are different kinds. Interchangeable endpoints with unequal
    # declared kinds let canonicalisation mint an orientation the pack never intended.

  - id: PARTY_TO
    label: party to
    domain: [Party]
    range: [Matter]
    description: Has an interest in this matter.
  - id: CITES
    label: cites
    domain: [Document, Authority]
    range: [Authority]
    description: Refers to this authority.
    help: "Asserts the document relied on this authority. A quote check can only
      confirm the citation *appears* on the page, never that it was relied on rather
      than distinguished — so this always needs review."
  - id: OVERRULES
    label: overrules
    domain: [Authority]
    range: [Authority]
    description: Displaces the cited authority.
    help: Governing because relying on overruled authority is a substantive error.
  - id: DISTINGUISHES
    label: distinguishes
    domain: [Authority, Document]
    range: [Authority]
    description: Argues the cited authority does not apply.
  - id: FILED_IN
    label: filed in
    domain: [Document, Matter]
    range: [Court]
    description: Lodged with this forum.
  - id: DEADLINE_FOR
    label: deadline for
    domain: [Deadline]
    range: [Matter, Document]
    description: A date-bound obligation on this matter.
  - id: SUBJECT_TO_PRIVILEGE
    label: subject to privilege
    domain: [Document, Clause]
    range: [Matter]
    description: Privileged material on this matter.
    help: Drives redaction and disclosure. Never model-extracted without review.
  - id: SUPERSEDES
    label: supersedes
    domain: [Document, Clause]
    range: [Document, Clause]
    description: Replaces the earlier instrument.
  - id: GOVERNED_BY
    label: governed by
    domain: [Matter, Document, Clause]
    range: [Authority]
    description: Subject to this law or jurisdiction.
  - id: CONTAINS_CLAUSE
    label: contains clause
    domain: [Document]
    range: [Clause]
    description: This document includes the provision.
  - id: RELATES_TO_MATTER
    label: relates to matter
    domain: [Document, Party, Deadline]
    range: [Matter]
    description: Belongs to this matter.
  - id: INSTRUCTS
    label: instructs
    domain: [Party]
    range: [Counsel]
    description: Retains this counsel.
  - id: AFFILIATE_OF
    label: affiliate of
    domain: [Party]
    range: [Party]
    description: The two parties are part of one corporate group, or one holds a stake in the other.
    help: The fact in the middle of a non-adjacent conflict. Without it, "the firm is attacking a company its own client part-owns" is two unrelated records and no rule can join them. Governing rather than descriptive because a conflict check reads it, and a synonym an extractor invented would make that check return nothing while looking clean.
    # Group membership carries through a chain of holding companies, and a structure deep enough
    # to hide a conflict is often one built to. Bounded, so a rule follows an ownership ladder
    # rather than assuming it reaches everywhere.
    transitive: true
  # ── Conclusions. Only a rule writes these; no extractor may propose one. ────
  #
  # Governing, not descriptive, by the same test as everything else here: would a wrong
  # answer embarrass you or expose you? A missed conflict is the second. Declaring them
  # also means a rule whose `then` names an undeclared predicate fails at pack load, so a
  # typo in a rule cannot mint a predicate that nothing queries.
  #
  # `blocks:` marks the ones that FORBID an answer rather than informing one, and names which
  # end of the edge is tainted. It is a separate axis from `governing`: every block is
  # governing, but most governing predicates are ordinary facts. Without it the ethical wall
  # had no rule-block source at all — it read `ctx.matter_denylist` and nothing else — so an
  # inferred conflict sat in the graph and shaped no refusal.
  - id: POTENTIAL_CONFLICT
    label: potential conflict
    domain: [Matter]
    range: [Party]
    description: The firm may be acting both for and against this party.
    help: Inferred, never extracted. It carries the premises that produced it, so the answer to "why do you believe this" is the two documents it rests on. Always read as *potential* - the judgement about whether it is a real conflict is a lawyer's.
    # The party only, on the same reasoning as RELIES_ON_STALE_AUTHORITY below.
    #
    # `both` blacked out the matter as well, which means the file the disputes team is retained to
    # run — on a memo whose own decision was "may be accepted subject to an information barrier".
    # Withholding the *party* is the barrier's substance; withholding the matter withholds the work.
    # A conflict about a party the firm also represents made that client's own file unanswerable:
    # "who is the counsel for Halveston" returned nothing.
    #
    # The per-person half of a barrier is an ethical screen (`MatterScreen`, keyed by user), which
    # is the control the fixture's memo actually describes — five named individuals, not a matter
    # nobody may read.
    blocks: object
    # Told, not withheld. Whether a potential conflict is a real one is a lawyer's judgement, and
    # they cannot make it from evidence they were never shown — suppressing the file is how "who is
    # the counsel for Halveston" came back with nothing. The firm's own risk memo reaches the same
    # conclusion in the fixture: the engagement "may be accepted subject to an information barrier",
    # which is a screen over named individuals, not a matter nobody may read.
    #
    # A screen remains the one true prohibition. This narrows a governance control on purpose, so
    # the finding still appears in the trace, still names its premises, and still sorts first.
    effect: notify
  - id: RELIES_ON_STALE_AUTHORITY
    label: relies on overruled authority
    domain: [Document]
    range: [Authority]
    description: This document rests on an authority that has since been overruled.
    help: Inferred from a citation plus an overruling recorded elsewhere. The advice was very likely correct when written, which is exactly why this is worth surfacing rather than treating as an error.
    # The document only. The authority is still a real case and withholding it would suppress
    # "Brown was overruled" — the single fact the reader most needs to be told.
    blocks: subject
    # Told, and the argument is stronger here than for a conflict. This is a quality finding, not a
    # conduct one: nobody is harmed by seeing their own memo, and suppressing it hides the very
    # advice that needs revising. A reader who is shown the document and told its authority was
    # overruled can act; a reader shown nothing cannot.
    #
    # With this, no rule finding in the legal pack withholds and an ethical screen is the only wall
    # left — which is the right shape. A screen is a recorded instruction that a person must not see
    # a matter. A rule finding is something the graph noticed and a lawyer decides about.
    effect: notify

# ── Open, with exact-name grounding. No LLM adjudication. ─────────────────────
descriptive_predicates:
  - id: CONCERNS_TOPIC
    label: concerns topic
    description: Subject-matter tag.
  - id: IN_INDUSTRY
    label: in industry
    description: Sector classification.
  - id: HAS_DEAL_TYPE
    label: has deal type
    description: Transaction category.
  - id: MENTIONS
    label: mentions
    description: Named in the text without a stronger relationship being established.
    help: The safe default when an extractor sees two entities together but cannot justify a governing predicate.
  # Catalog enrichment. Descriptive, so approval lands these on the trust floor rather than in the
  # answerable band: a description helps a model read a schema and must never outrank a fact with
  # consequence. Deliberately no domain/range -- declaring either turns on endpoint validation, and
  # no pack declares a Description entity kind, so every enrichment write would then be rejected.
  - id: DESCRIBED_AS
    label: described as
    description: Plain-language description of a table or column, written by a person or proposed by a model.
    help: A model's description waits for review like any other reading. Only an approved one reaches the query planner.
  - id: HAS_SYNONYM
    label: has synonym
    description: Another name people use for this table, so a question using their word still finds it.

# Rules materialise INFERRED edges. Each carries premises, so any conclusion
# unwinds into a proof tree.
rules:
  - id: conflict_check
    version: v1
    description: Flag a potential conflict where the firm both represents and opposes a party.
    help: Fires only on facts a person signed off, or a system of record declared. A conflict flag resting on an unreviewed model guess would be worse than none, because someone would rely on it.
    when:
      - "(c:Counsel)-[:REPRESENTS]->(p:Party)"
      - "(m:Matter)-[:ADVERSE_TO]->(p:Party)"
    then: "(m)-[:POTENTIAL_CONFLICT]->(p)"
    min_premise_class: EXTRACTED_MODEL
  - id: conflict_via_affiliate
    version: v1
    description: Flag a potential conflict where the firm opposes an affiliate of a party it represents.
    help: The conflict nobody sees, because no single document contains it. The firm acts for Northwind and opposes Calder in an unrelated matter; a third document records that the two are in one group. Each fact is unremarkable alone. The affiliation is followed as a chain of up to three links, so an intermediate holding company does not hide the conflict.
    when:
      - "(c:Counsel)-[:REPRESENTS]->(q:Party)"
      # Written as a path, not a plain edge. `AFFILIATE_OF` is transitive, but that declaration is
      # inert unless a rule asks to walk it -- and a one-hop premise silently missed exactly the
      # multi-hop ownership structures this rule exists to catch.
      - "(q:Party)-[:AFFILIATE_OF*1..3]->(p:Party)"
      - "(m:Matter)-[:ADVERSE_TO]->(p:Party)"
    then: "(m)-[:POTENTIAL_CONFLICT]->(q)"
    min_premise_class: EXTRACTED_MODEL
  - id: authority_stale
    version: v1
    description: Mark reliance on authority that has since been overruled.
    when:
      - "(d:Document)-[:CITES]->(a:Authority)"
      - "(x:Authority)-[:OVERRULES]->(a:Authority)"
    then: "(d)-[:RELIES_ON_STALE_AUTHORITY]->(a)"
    min_premise_class: EXTRACTED_MODEL
