[project]
name = "groundwork"
version = "0.1.0"
description = "Groundwork — a governed semantic layer over structured and unstructured data, with per-assertion provenance. Domain-agnostic; ships with a legal ontology."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "mangum>=0.19.0",
    "uvicorn>=0.34.0",
    # Separate from uvicorn on purpose. Without a WebSocket protocol library uvicorn cannot
    # honour an Upgrade request and answers 404, which is what the live ingest endpoint did
    # in production while passing locally -- TestClient speaks ASGI directly and needs none.
    # Not `uvicorn[websockets]`: that extra was removed in uvicorn 0.52, so it resolves to
    # nothing and installs no protocol library at all.
    "websockets>=13.0",
    "neo4j>=5.25.0",
    "boto3>=1.35.0",
    "sqlglot>=26.0",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
    "mcp>=1.9,<2.0",
    # The Retrieval agent's loop. Deliberately NOT `strands-agents-tools`: this agent binds
    # only the MCP tools, and that package's built-ins are shell, file and http access, which
    # is precisely what must never be reachable from a loop a model drives.
    "strands-agents>=1.53,<2",
    "pydantic>=2.0",
    "pyjwt[crypto]>=2.8.0",
    # Multipart upload for POST /tenants/{t}/documents.
    "python-multipart>=0.0.9",
    # AGPL-3.0, and used only to rasterise a PDF page to PNG. Must be swapped before
    # commercial release; `PyMuPDFRenderer` isolates it so that is a one-class change.
    "pymupdf>=1.24",
    # SigV4-signed client for OpenSearch Serverless. Without it embeddings fall back to
    # process memory and are lost on every deploy, while the provisioned collection bills.
    "opensearch-py>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "testcontainers[neo4j]>=4.0",
    "ruff>=0.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
